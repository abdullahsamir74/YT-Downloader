[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
version = "2.0.0"
description = "Modern YouTube Downloader with Clean Architecture & Interactive Console Dashboard"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.0.0",
    "rich>=13.0.0",
]

[project.scripts]
yt-dl = "yt_downloader.cli:main"
yt-downloader = "yt_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["yt_downloader*"]
